<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Clipper</title>
    <meta name="description" content="Share and discover Blender node setups - Geometry Nodes, Shaders, and more">
    
    <!-- OG_PLACEHOLDER: Asset-specific OG tags are injected here by server -->
    <!-- Open Graph (works with Discord, Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tree Clipper">
    <meta property="og:description" content="Share and discover Blender node setups - Geometry Nodes, Shaders, and more">
    
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Logo - top left -->
    <a href="/" class="site-logo">
        <img src="/icon.svg" alt="Tree Clipper" class="logo-img">
        <span class="logo-text">Tree Clipper</span>
    </a>
    
    <!-- Login corner - rendered once, persists across page navigations -->
    <div class="login-corner"></div>
    
    <!-- SPA content container - page content loaded here dynamically -->
    <div id="spa-content"></div>
    
    <!-- Prototype warning - bottom left -->
    <div class="prototype-warning">Early Prototype, data not yet persistent</div>
    
    <script type="module">
        import { initLoginCorner } from '/auth.js';
        import { initRouter } from '/router.js';
        
        // Initialize login corner once - it persists across page navigations
        initLoginCorner();
        
        // Initialize the SPA router
        initRouter();
    </script>
</body>
</html>
